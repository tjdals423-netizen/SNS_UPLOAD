<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 완료</title>
<style>
body{font-family:sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}
textarea{width:100%;height:120px;font-size:14px;padding:8px;box-sizing:border-box}
button{font-size:16px;padding:10px 20px;margin-top:8px;cursor:pointer}
#ok{color:#0a7d2c;font-weight:bold;margin-left:8px}
</style>
</head>
<body>
<h1>로그인 완료</h1>
<p>아래 주소 전체를 복사해서 봇 실행 창(검은 창)에 붙여넣고 Enter를 누르세요.</p>
<textarea id="url" readonly></textarea>
<br><button id="copy">복사하기</button><span id="ok"></span>
<script>
var box = document.getElementById('url');
box.value = window.location.href;
document.getElementById('copy').onclick = function () {
  box.select();
  try { navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
  document.getElementById('ok').textContent = '복사됨!';
};
</script>
</body>
</html>
